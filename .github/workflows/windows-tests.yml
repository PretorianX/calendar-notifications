name: windows-tests

# Runs the test suite on Windows for every branch push and pull request.
# The suite includes the tray integration test, which needs a real Windows desktop.
on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  windows-tests:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipenv

      - name: Install dependencies (pipenv sync)
        env:
          PIPENV_IGNORE_VIRTUALENVS: "1"
        run: pipenv sync --dev

      - name: Run tests
        env:
          PIPENV_IGNORE_VIRTUALENVS: "1"
          QT_QPA_PLATFORM: offscreen
        run: pipenv run pytest
